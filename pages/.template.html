<!DOCTYPE html>
<html lang="en">
<!-- data-theme attribute will be managed by JS -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dawson Game Dev Club</title>
  <link rel="stylesheet" href="/styles/style.css" />
  <script src="/scripts/script.js" defer></script>
</head>

<body>

  <!--
      FOUC PREVENTION SCRIPT:
      This runs instantly before the page content is rendered to set the theme,
      preventing a "flash of unstyled content" if the user has a saved
      or OS-level preference for a non-default theme.
    -->
  <script>
    (function () {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <header class="navbar">
    <div class="navbar__container">
      <a href="/index.html" class="navbar__brand">Dawson Game Dev Club</a>

      <button class="navbar__toggle" id="navbarToggle" aria-label="Toggle navigation" aria-controls="navbarMenu"
        aria-expanded="false">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </button>

      <nav id="navbarMenu" class="navbar__menu" role="navigation">
        <ul class="navbar__list">
          <li class="navbar__item"><a href="/index.html" class="navbar__link">Home</a></li>
          <!--<li class="navbar__item"><a href="#" class="navbar__link">Features</a></li>
          <li class="navbar__item"><a href="#" class="navbar__link">Pricing</a></li>-->
          <li class="navbar__item">
            <button id="theme-toggle" aria-label="Toggle light and dark theme">
              <!-- Sun Icon for switching to Light Mode -->
              <svg class="theme-icon sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                fill="currentColor" aria-hidden="true">
                <path
                  d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12Zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M11 1h2v3h-2V1Zm0 19h2v3h-2v-3ZM20.414 4.929l-1.414-1.414L17.586 5L19 6.414l1.414-1.485ZM3.586 19.001l1.414 1.414L6.414 19l-1.414-1.414-1.414 1.414ZM23 11v2h-3v-2h3ZM4 11v2H1v-2h3ZM17.586 19l1.414-1.414-1.414-1.414-1.414 1.414 1.414 1.414Z" />
              </svg>
              <!-- Moon Icon for switching to Dark Mode -->
              <svg class="theme-icon moon-icon" xmlns="http://www.w.org/2000/svg" viewBox="0 0 24 24"
                fill="currentColor" aria-hidden="true">
                <path
                  d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2ZM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8Z M13.5 12c0-3.08-1.57-5.8-4-7.44C12.42 3.5 16.53 7.03 16.53 12s-4.11 8.5-7.03 9.44c2.43-1.64 4-4.37 4-7.44Z" />
              </svg>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="content">
    <h1>Header</h1>
    <p>Content</p>
  </main>

</body>

</html>
